<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>IP-SAKTI | Sahayak</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#123a6b">

<!-- IP-SAKTI SAHAYAK: consolidated single-file frontend -->
<style>
/* IP-SAKTI · Sahayak — theme tokens */
:root{
  --bg:#f3f5f9;
  --surface:#ffffff;
  --surface-2:#f7f9fc;
  --raise:#eef2f8;
  --border:#dfe5ee;
  --border-soft:#e9edf4;
  --text:#141d2e;
  --muted:#5f6c80;
  --faint:#8a95a6;
  --accent:#1a4fa0;
  --accent-2:#2f6fd0;
  --accent-soft:#e7f0ff;
  --saffron:#c2711c;
  --green:#127a52;
  --green-soft:#e2f5ec;
  --amber:#8a5b00;
  --amber-soft:#fdf0d6;
  --violet:#5a3fb5;
  --violet-soft:#eeeaff;
  --red:#a6322f;
  --red-soft:#fdeaea;
  --shadow:0 1px 2px rgba(18,30,52,.06), 0 10px 26px rgba(18,30,52,.07);
  --radius:12px;
}
html[data-theme="dark"]{
  --bg:#0e1420;
  --surface:#141c2b;
  --surface-2:#18212f;
  --raise:#1d2737;
  --border:#263247;
  --border-soft:#1f2a3b;
  --text:#e6ecf6;
  --muted:#9aa8bd;
  --faint:#76839a;
  --accent:#7aa8f5;
  --accent-2:#8fb8fb;
  --accent-soft:#1b2a45;
  --saffron:#e3a662;
  --green:#5fd3a4;
  --green-soft:#12362a;
  --amber:#e7bc6a;
  --amber-soft:#3a2e13;
  --violet:#b3a3ff;
  --violet-soft:#262046;
  --red:#f09090;
  --red-soft:#3a1f1f;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:"Segoe UI","Noto Sans",system-ui,-apple-system,"Noto Sans Devanagari","Noto Sans Tamil",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
button,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:6px}

.app{display:flex;min-height:100%}

/* ---------- sidebar ---------- */
.sidebar{
  width:272px;flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px;border-bottom:1px solid var(--border-soft)}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(150deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center}
.brand h2{margin:0;font-size:17px;letter-spacing:.3px}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.menu{padding:14px 10px;overflow-y:auto}
.title{margin:14px 10px 6px;font-size:11.5px;color:var(--faint);letter-spacing:.4px}
.menu .title:first-child{margin-top:2px}
.item{
  width:100%;border:1px solid transparent;background:transparent;cursor:pointer;
  display:flex;align-items:center;gap:12px;text-align:left;
  padding:9px 11px;margin-bottom:2px;border-radius:9px;
}
.item:hover{background:var(--raise)}
.item.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent)}
.item .ico{width:26px;height:26px;flex-shrink:0;display:grid;place-items:center;border-radius:7px;background:var(--raise);color:var(--muted);font-size:13px}
.item.active .ico{background:var(--surface);color:var(--accent)}
.item b{display:block;font-size:14.5px;font-weight:600}
.item small{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.item.active small{color:color-mix(in srgb,var(--accent) 70%,var(--muted))}
.coverage{margin-top:auto;padding:16px 18px;border-top:1px solid var(--border-soft);font-size:12px;color:var(--muted)}
.coverage p{margin:6px 0 0}
.coverage .sources{color:var(--faint)}
.pill{display:inline-block;padding:1px 5px;border-radius:4px;background:var(--raise);font-size:10.5px}

/* ---------- topbar ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:5;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  padding:16px 26px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;
}
.topbar h1{margin:0;font-size:20px;letter-spacing:.2px}
.topbar p{margin:5px 0 0;color:var(--muted);font-size:13.5px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.languages{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);padding:3px;border-radius:9px}
.lang{background:transparent;border:0;color:var(--muted);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
.lang:hover{background:var(--raise)}
.lang.active{background:var(--accent);color:#fff}
html[data-theme="dark"] .lang.active{color:#0e1420}
.theme{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.theme:hover{background:var(--raise)}

/* ---------- content ---------- */
.content{flex:1;padding:22px 26px 40px;overflow-x:hidden}
.content.with-composer{padding-bottom:150px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}

/* toolbar */
.toolbar{padding:16px 18px;border-bottom:1px solid var(--border-soft)}
.search{
  width:min(380px,100%);padding:10px 13px;border-radius:9px;
  border:1px solid var(--border);background:var(--surface-2);outline:none;
}
.search:focus{border-color:var(--accent-2);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip:hover{background:var(--raise)}
.chip.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent)}
.count{margin-top:11px;font-size:12.5px;color:var(--faint)}

/* tables */
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th{
  text-align:left;font-size:12px;font-weight:600;color:var(--faint);
  padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);
  position:sticky;top:0;
}
td{padding:14px 16px;border-bottom:1px solid var(--border-soft);font-size:13.5px;vertical-align:top;line-height:1.5}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:12.5px;color:var(--muted);white-space:nowrap}
.strong{font-weight:600}
.dim{color:var(--muted)}
.nowrap{white-space:nowrap}

/* badges */
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.b-green{background:var(--green-soft);color:var(--green)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-blue{background:var(--accent-soft);color:var(--accent)}
.b-violet{background:var(--violet-soft);color:var(--violet)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-plain{background:var(--raise);color:var(--muted)}

/* regulation cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;padding:18px}
.card{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:16px;cursor:pointer}
.card:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.card h3{margin:0 0 8px;font-size:14.5px;line-height:1.4;padding-right:8px}
.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card-tags{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}

/* empty state */
.empty{padding:46px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;margin-bottom:6px;color:var(--text)}

/* ---------- ask page ---------- */
.ask-wrap{max-width:780px;margin:0 auto}
.hero{
  border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  background:linear-gradient(135deg,var(--accent-soft),var(--surface) 65%);
  display:flex;gap:15px;box-shadow:var(--shadow);
}
.bot{width:44px;height:44px;flex-shrink:0;border-radius:12px;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-size:20px;border:1px solid var(--border)}
.hero h2{margin:2px 0 6px;font-size:18px}
.hero p{margin:0;color:var(--muted);line-height:1.6;font-size:14px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.quick button{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:13px}
.quick button:hover{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
#chat{margin-top:6px}
.message{margin:14px 0;padding:14px 16px;border-radius:12px;line-height:1.65;font-size:14px}
.message.user{background:var(--accent);color:#fff;margin-left:20%;border-bottom-right-radius:4px}
html[data-theme="dark"] .message.user{color:#0e1420}
.message.answer{background:var(--surface);border:1px solid var(--border);margin-right:8%;border-bottom-left-radius:4px;box-shadow:var(--shadow)}
.source{margin-top:12px;padding-top:10px;border-top:1px solid var(--border-soft);font-size:12px;color:var(--muted)}
.confidence{display:inline-block;margin-top:9px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px}
.typing span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ---------- composer ---------- */
.composer-area{
  position:sticky;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--border);
  padding:12px 26px calc(14px + env(safe-area-inset-bottom,0px));
}
.composer{max-width:780px;margin:auto;border:1px solid var(--border);border-radius:12px;display:flex;background:var(--surface);overflow:hidden}
.composer:focus-within{border-color:var(--accent-2)}
.composer textarea{flex:1;border:0;outline:0;resize:none;padding:13px 15px;background:transparent;max-height:120px}
.mic,.send{border:0;cursor:pointer}
.mic{width:48px;background:transparent;color:var(--accent);font-size:17px}
.mic.listening{background:var(--red-soft);color:var(--red)}
.send{padding:0 20px;background:var(--accent);color:#fff;font-weight:600}
html[data-theme="dark"] .send{color:#0e1420}
.footer{max-width:780px;margin:8px auto 0;font-size:11.5px;color:var(--faint);display:flex;gap:7px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.dot.off{background:var(--amber)}
.powered{margin-left:auto}

/* ---------- detail sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:rgba(10,16,28,.45)}
.sheet{
  position:absolute;top:0;right:0;height:100%;width:min(460px,100%);
  background:var(--surface);border-left:1px solid var(--border);
  padding:26px 24px calc(26px + env(safe-area-inset-bottom,0px));
  overflow-y:auto;animation:slideIn .18s ease-out;
}
@keyframes slideIn{from{transform:translateX(18px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.typing span{animation:none}}
.sheet-close{position:absolute;top:16px;right:16px;border:1px solid var(--border);background:var(--surface-2);width:30px;height:30px;border-radius:8px;cursor:pointer;color:var(--muted)}
.sheet h3{margin:4px 0 4px;font-size:18px;line-height:1.35;padding-right:36px}
.sheet .eyebrow{font-size:12px;color:var(--faint);margin:0}
.kv{margin-top:20px;border-top:1px solid var(--border-soft)}
.kv div{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px}
.kv dt{width:130px;flex-shrink:0;color:var(--faint);font-size:12.5px;padding-top:1px}
.kv dd{margin:0;flex:1;line-height:1.55}
.note{margin-top:18px;padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border-soft);font-size:12.5px;color:var(--muted);line-height:1.6}

/* ---------- responsive ---------- */
.drawer-btn{display:none}
@media(max-width:960px){
  .sidebar{position:fixed;z-index:30;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .drawer-btn{display:grid;place-items:center;position:fixed;z-index:31;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
  .topbar{padding-left:62px}
  .content,.composer-area{padding-left:16px;padding-right:16px}
  .message.user{margin-left:6%}
  .message.answer{margin-right:0}
}
@media(max-width:560px){
  .topbar{padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .lang{padding:6px 8px;font-size:12px}
  .powered{display:none}
  .cards{grid-template-columns:1fr;padding:14px}
}

/* ==============================
   RAG ANSWER FORMATTING
   ============================== */

.answer-content strong {
  font-weight: 700;
}


.answer-heading {
  display: block;
  margin-top: 12px;
  margin-bottom: 8px;
  font-size: 1.05em;
}


.answer-bullet {
  margin: 3px 0;
  padding-left: 4px;
}


.answer-number {
  margin: 3px 0;
}


/* ==============================
   SOURCE CARDS
   ============================== */

.sources-title {
  margin-top: 22px;
  padding-top: 14px;

  border-top: 1px solid
    rgba(255,255,255,0.08);

  font-size: 12px;
  font-weight: 700;

  letter-spacing: 0.08em;
  text-transform: uppercase;

  opacity: 0.65;
}


.sources-list {
  margin-top: 10px;
}


.source-card {
  padding: 11px 13px;
  margin-bottom: 8px;

  border: 1px solid
    rgba(255,255,255,0.07);

  border-radius: 10px;

  background: rgba(255,255,255,0.025);
}


.source-label {
  font-size: 10px;
  font-weight: 700;

  letter-spacing: 0.08em;

  opacity: 0.55;

  margin-bottom: 5px;
}


.source-document {
  font-size: 12px;
  line-height: 1.5;

  opacity: 0.85;
}


.source-page {
  margin-top: 4px;

  font-size: 11px;

  opacity: 0.55;
}

.sahayak-loading {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  box-sizing: border-box;
  font-size: 13px;
  line-height: 1.4;
  opacity: 0.75;
  white-space: nowrap;
  overflow: hidden;
}

.loading-symbol {
  flex: 0 0 auto;
  animation: sahayakPulse 1.2s ease-in-out infinite;
}

.loading-text {
  flex: 0 1 auto;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.loading-symbol {
  flex: 0 0 auto;
  animation: sahayakPulse 1.2s ease-in-out infinite;
}

.typing {
  border-top: none !important;
  border-bottom: none !important;
  box-shadow: none !important;
}

@keyframes sahayakPulse {
  0%, 100% {
    opacity: 0.35;
    transform: scale(0.9);
  }

  50% {
    opacity: 1;
    transform: scale(1.1);
  }
}
</style>
</head>
<body>
<div class="app">

  <button class="drawer-btn" id="drawerBtn" aria-label="Menu">☰</button>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2c3.5 4 6 7.2 6 10.4A6 6 0 0 1 6 12.4C6 9.2 8.5 6 12 2z" fill="currentColor"/></svg>
      </div>
      <div>
        <h2>IP-SAKTI</h2>
        <p data-i18n="brandSub">Sahayak · सहायक</p>
      </div>
    </div>

    <nav class="menu" id="menu">
      <p class="title" data-i18n="groupAI">AI Assistant</p>
      <button class="item active" data-page="ask">
        <span class="ico">◍</span>
        <span><b data-i18n="navAsk">Ask Sahayak</b><small data-i18n="navAskSub">सहायक से पूछें</small></span>
      </button>
      <p class="title" data-i18n="groupDB">IP Databases</p>
      <button class="item" data-page="registry">
        <span class="ico">▤</span>
        <span><b data-i18n="navRegistry">IP Registry</b><small data-i18n="navRegistrySub">आईपी रजिस्ट्री</small></span>
      </button>
      <button class="item" data-page="patents">
        <span class="ico">⌕</span>
        <span><b data-i18n="navPatents">Patent Search</b><small data-i18n="navPatentsSub">पेटेंट खोज</small></span>
      </button>
      <button class="item" data-page="cases">
        <span class="ico">§</span>
        <span><b data-i18n="navCases">Case Law</b><small data-i18n="navCasesSub">मामला कानून</small></span>
      </button>
      <p class="title" data-i18n="groupReg">Regulatory</p>
      <button class="item" data-page="regulations">
        <span class="ico">⬡</span>
        <span><b data-i18n="navRegs">Regulations Library</b><small data-i18n="navRegsSub">विनियम पुस्तकालय</small></span>
      </button>
      <button class="item" data-page="glossary">
        <span class="ico">A</span>
        <span><b data-i18n="navGloss">Glossary</b><small data-i18n="navGlossSub">शब्दकोश</small></span>
      </button>
    </nav>

    <div class="coverage">
      <b data-i18n="coverTitle">Regime coverage</b>
      <p><span class="pill">IN</span> <span data-i18n="coverNat">National</span> · <span class="pill">🌐</span> <span data-i18n="coverIntl">International</span></p>
      <p class="sources">WIPO · WTO · CBD · EU · USPTO</p>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="head-text">
        <h1 id="pageTitle">Ask Sahayak</h1>
        <p id="pageSubtitle">Guidance with sources, in your language</p>
      </div>
      <div class="controls">
        <div class="languages" id="langBar" role="group" aria-label="Language">
          <button class="lang active" data-lang="EN">EN</button>
          <button class="lang" data-lang="HI">हिं</button>
          <button class="lang" data-lang="TA">தமிழ்</button>
          <button class="lang" data-lang="ML">മല</button>
          <button class="lang" data-lang="KN">ಕನ್ನ</button>
        </div>
        <button class="theme" id="themeBtn" title="Theme"><span id="themeIcon">☾</span><span id="themeText" data-i18n="themeDark">Dark</span></button>
      </div>
    </header>

    <section class="content" id="content"></section>

    <div class="composer-area" id="composerArea">
      <div class="composer">
        <textarea id="question" rows="1" placeholder="Ask about IP, patents, GI, regulations, traditional knowledge…"></textarea>
        <button class="mic" id="micBtn" aria-label="Speak">🎙</button>
        <button class="send" id="sendBtn" data-i18n="send">Send</button>
      </div>
      <div class="footer">
        <span class="dot" id="dot"></span><span id="status">RAG Knowledge Base · 939 chunks indexed</span>
        <span class="powered">TKDL · CBD · WIPO · CGPDTM · Ministry of AYUSH</span>
      </div>
    </div>
  </main>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-bg" id="sheetBg"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true">
    <button class="sheet-close" id="sheetClose" aria-label="Close">✕</button>
    <div id="sheetBody"></div>
  </aside>
</div>

<script src="script.js"></script>

<script>
/* ============================================================
   IP-SAKTI · Sahayak — front-end logic
   Data is local. No backend needed.
   ============================================================ */

/* ---------------- 1. DATA ---------------- */

const REGISTRY = [];

const PATENTS = [];

const CASES = [];

const REGULATIONS = [];

const GLOSSARY = [];

const KB = [];

/* ---------------- 2. LANGUAGES ---------------- */

const I18N = {
  EN:{
    brandSub:"Sahayak · Your IP helper", groupAI:"AI assistant", groupDB:"IP databases", groupReg:"Regulatory",
    navAsk:"Ask Sahayak", navAskSub:"Questions answered with sources",
    navRegistry:"IP Registry", navRegistrySub:"Patents, GIs and trademarks",

/* ---------------- 3. STATE ---------------- */

const state = {lang:"EN", page:"ask", filter:"all", query:"", chat:[]};
const t = k => (I18N[state.lang] && I18N[state.lang][k]) || I18N.EN[k] || k;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- 4. THEME ---------------- */

function applyTheme(mode){
  document.documentElement.setAttribute("data-theme", mode);
  $("#themeIcon").textContent = mode === "dark" ? "☀" : "☾";
  $("#themeText").textContent = mode === "dark" ? t("themeLight") : t("themeDark");
  try{ localStorage.setItem("ipsakti-theme", mode); }catch(e){}
}
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem("ipsakti-theme"); }catch(e){}
  if(!saved) saved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(saved);
}
$("#themeBtn").addEventListener("click", () => {
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
});

/* ---------------- 5. LANGUAGE ---------------- */

function applyLanguage(){
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = t(el.getAttribute("data-i18n"));
    if(v) el.textContent = v;
  });
  $("#question").placeholder = t("placeholder");
  $("#themeText").textContent = document.documentElement.getAttribute("data-theme") === "dark" ? t("themeLight") : t("themeDark");
  document.documentElement.lang = {EN:"en",HI:"hi",TA:"ta",ML:"ml",KN:"kn"}[state.lang];
  updateStatus();
  render();
}
$("#langBar").addEventListener("click", e => {
  const b = e.target.closest(".lang"); if(!b) return;
  state.lang = b.dataset.lang;
  document.querySelectorAll(".lang").forEach(x => x.classList.toggle("active", x === b));
  applyLanguage();
});

/* ---------------- 6. NAVIGATION ---------------- */

const PAGES = {
  ask:{title:"titleAsk", sub:"subAsk"},
  registry:{title:"titleRegistry", sub:"subRegistry"},
  patents:{title:"titlePatents", sub:"subPatents"},
  cases:{title:"titleCases", sub:"subCases"},
  regulations:{title:"titleRegs", sub:"subRegs"},
  glossary:{title:"titleGloss", sub:"subGloss"}
};

$("#menu").addEventListener("click", e => {
  const b = e.target.closest(".item"); if(!b) return;
  state.page = b.dataset.page;
  state.filter = "all";
  state.query = "";
  document.querySelectorAll(".item").forEach(x => x.classList.toggle("active", x === b));
  $("#sidebar").classList.remove("open");
  render();
});

$("#drawerBtn").addEventListener("click", () => $("#sidebar").classList.toggle("open"));

/* ---------------- 7. RENDER ---------------- */

function render(){
  $("#pageTitle").textContent = t(PAGES[state.page].title);
  $("#pageSubtitle").textContent = t(PAGES[state.page].sub);
  const onAsk = state.page === "ask";
  $("#composerArea").hidden = !onAsk;
  $("#content").classList.toggle("with-composer", false);
  const c = $("#content");
  if(onAsk) renderAsk(c);
  else if(state.page === "registry") renderRegistry(c);
  else if(state.page === "patents") renderPatents(c);
  else if(state.page === "cases") renderCases(c);
  else if(state.page === "regulations") renderRegulations(c);
  else renderGlossary(c);
}

function badge(status){
  const map = {
    "Granted":"b-green","Registered":"b-green","Published":"b-blue","Pending":"b-amber",
    "Under Examination":"b-blue","Opposed":"b-red","Revoked":"b-red","International Phase":"b-violet"
  };
  const label = {
    "Granted":t("granted"),"Registered":t("registered"),"Published":t("published"),
    "Pending":t("pending"),"Opposed":t("opposed")
  }[status] || status;
  return `<span class="badge ${map[status]||"b-plain"}">${esc(label)}</span>`;
}

function toolbar(chips, placeholderKey){
  return `<div class="toolbar">
    <input class="search" id="searchBox" placeholder="${esc(t(placeholderKey))}" value="${esc(state.query)}">
    <div class="chips" id="chipBar">${chips.map(c =>
      `<button class="chip ${state.filter===c.k?"active":""}" data-k="${c.k}">${esc(t(c.l))}</button>`).join("")}</div>
  </div>`;
}

function wireToolbar(){
  const s = $("#searchBox");
  if(s) s.addEventListener("input", e => {
    state.query = e.target.value;
    render();
    const n = $("#searchBox"); n.focus(); n.setSelectionRange(n.value.length, n.value.length);
  });
  const cb = $("#chipBar");
  if(cb) cb.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if(!b) return;
    state.filter = b.dataset.k; render();
  });
}

function matches(obj){
  if(!state.query.trim()) return true;
  return JSON.stringify(obj).toLowerCase().includes(state.query.toLowerCase());
}

function emptyRow(cols){
  return `<tr><td colspan="${cols}"><div class="empty"><b>${esc(t("noMatch"))}</b>${esc(t("noMatchSub"))}</div></td></tr>`;
}

/* --- IP Registry --- */
function renderRegistry(c){
  const chips = [{k:"all",l:"all"},{k:"Patent",l:"patent"},{k:"GI",l:"gi"},{k:"Trademark",l:"trademark"},
    {k:"National",l:"national"},{k:"International",l:"international"},
    {k:"Registered",l:"registered"},{k:"Pending",l:"pending"},{k:"Opposed",l:"opposed"}];
  const rows = REGISTRY.filter(r =>
    matches(r) && (state.filter==="all" || r.type===state.filter || r.regime===state.filter || r.status===state.filter));
  c.innerHTML = `<div class="panel">${toolbar(chips,"search")}
  <div class="table-scroll"><table><thead><tr>
    <th>${t("colId")}</th><th>${t("colTitle")}</th><th>${t("colType")}</th><th>${t("colOwner")}</th>
    <th>${t("colClass")}</th><th>${t("colFiled")}</th><th>${t("colRegime")}</th><th>${t("colStatus")}</th>
  </tr></thead><tbody>${rows.length ? rows.map((r,i) => `<tr data-i="${REGISTRY.indexOf(r)}">
    <td class="mono">${esc(r.id)}</td><td class="strong">${esc(r.title)}</td><td>${esc(r.type)}</td>
    <td class="dim">${esc(r.owner)}</td><td class="dim">${esc(r.cls)}</td><td class="mono">${esc(r.filed)}</td>
    <td class="dim">${esc(r.regime)}</td><td>${badge(r.status)}</td></tr>`).join("") : emptyRow(8)}
  </tbody></table></div></div>`;
  wireToolbar();
  c.querySelectorAll("tbody tr[data-i]").forEach(tr => tr.onclick = () => {

/* --- Ask Sahayak --- */
function renderAsk(c){
  $("#content").classList.add("with-composer");
  c.innerHTML = `<div class="ask-wrap">
    <div class="hero"><div class="bot">✦</div>
      <div><h2>${esc(t("hello"))}</h2><p>${esc(t("heroLine"))}</p></div></div>
    <div class="quick" id="quickBar">
      <button data-q="patent">${esc(t("q1"))}</button>
      <button data-q="gi">${esc(t("q2"))}</button>
      <button data-q="traditional knowledge">${esc(t("q3"))}</button>
      <button data-q="ayush">${esc(t("q4"))}</button>
    </div>
    <div id="chat"></div>
  </div>`;
  $("#quickBar").addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    $("#question").value = b.textContent; ask(b.dataset.q);
  });
  redrawChat();
}

function redrawChat(){

  const chat = $("#chat");

  if(!chat) return;


  chat.innerHTML = state.chat.map(m => {

    // USER MESSAGE
    if(m.role === "user"){

      return `
        <div class="message user">
          ${esc(m.text)}
        </div>
      `;

    }


    // FORMAT AI ANSWER
    let answer = esc(m.text);

    // Bold: **text**
    answer = answer.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );

    // Headings: ### Heading
    answer = answer.replace(
      /^### (.*?)$/gm,
      "<strong class=\"answer-heading\">$1</strong>"
    );

    // Bullet points
    answer = answer.replace(
      /^- (.*?)$/gm,
      "<div class=\"answer-bullet\">• $1</div>"
    );

    // Numbered points
    answer = answer.replace(
      /^\d+\.\s(.*?)$/gm,
      "<div class=\"answer-number\">$1</div>"
    );

    // New lines
    answer = answer.replace(
      /\n/g,
      "<br>"
    );


    // SOURCE CARDS
const sourceHtml = (m.sources || [])
  .slice(0, 3)
  .map((s, index) => {

    const cleanSource = s.source
      .replace(/^\d+_/, "")
      .replace(/\.pdf$/i, "")
      .replace(/_/g, " ");

    return `
      <div class="source-card">

        <div class="source-label">
          SOURCE ${index + 1}
        </div>

        <div class="source-document">
          📄 ${esc(cleanSource)}
        </div>

        <div class="source-page">
          Page ${esc(String(s.page))}
        </div>

      </div>
    `;

  })
  .join("");


    return `
      <div class="message answer">

        <div class="answer-content">
          ${answer}
        </div>

        ${
          sourceHtml
            ? `
              <div class="sources-title">
                Sources
              </div>

              <div class="sources-list">
                ${sourceHtml}
              </div>
            `
            : ""
        }

      </div>
    `;

  }).join("");


  const last = chat.lastElementChild;

  if(last){

    last.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });

  }

}

async function ask(forced){

  const box = $("#question");
  const q = forced || box.value.trim();

  if(!q) return;

  state.chat.push({
    role: "user",
    text: q
  });

  box.value = "";

  redrawChat();

  const chat = $("#chat");

  const wait = document.createElement("div");

  wait.className = "message answer typing";

wait.innerHTML = `
  <div class="sahayak-loading">
    <span class="loading-symbol">✦</span>
    <span class="loading-text">Sahayak is searching the knowledge base...</span>
  </div>
`;

  chat.appendChild(wait);

  chat.scrollTop = chat.scrollHeight;


  try {

    const response = await fetch(
      "http://127.0.0.1:8000/ask",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          question: q
        })
      }
    );


    const data = await response.json();


    if(!response.ok){

      throw new Error(
        data.detail || "Request failed"
      );

    }


    state.chat.push({

      role: "bot",

      text:
        data.answer ||
        "No answer was returned.",

      sources:
        data.sources || []

    });


  } catch(error) {

    console.error(error);

    state.chat.push({

      role: "bot",

      text:
        "I could not connect to the IP-SAKTI backend. " +
        "Please make sure the FastAPI server is running.",

      sources: []

    });

  }


  redrawChat();

}

$("#sendBtn").addEventListener("click", () => ask());
$("#question").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask(); }
});

function openSheet(title, eyebrow, pairs, note){

    <dl class="kv">${pairs.map(([k,v]) => `<div><dt>${esc(k)}</dt><dd>${/^<span/.test(v) ? v : esc(v)}</dd></div>`).join("")}</dl>
    ${note ? `<div class="note"><b>${esc(t("about"))}</b><br>${esc(note)}</div>` : ""}
    <div class="note">${esc(t("disclaimer"))}</div>`;
  $("#sheetWrap").hidden = false;
}
function closeSheet(){ $("#sheetWrap").hidden = true; }
$("#sheetBg").addEventListener("click", closeSheet);
$("#sheetClose").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });

/* ---------------- 9. VOICE, STATUS, OFFLINE ---------------- */

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $("#micBtn");
if(SR){
  const rec = new SR();
  rec.onresult = e => { $("#question").value = e.results[0][0].transcript; };
  rec.onend = () => { mic.classList.remove("listening"); mic.textContent = "🎙"; };
  mic.onclick = () => {
    rec.lang = {EN:"en-IN",HI:"hi-IN",TA:"ta-IN",ML:"ml-IN",KN:"kn-IN"}[state.lang];
    try{ rec.start(); mic.classList.add("listening"); mic.textContent = "⏺"; }catch(err){}
  };
} else { mic.disabled = true; mic.title = "Voice input not supported in this browser"; }

function updateStatus(){
  $("#status").textContent = navigator.onLine ? t("online") : t("offline");
  $("#dot").classList.toggle("off", !navigator.onLine);
}
window.addEventListener("online", updateStatus);
window.addEventListener("offline", updateStatus);

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

initTheme();
applyLanguage();
